<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Business Trip English Flashcards</title>
<style>
:root{
  --bg:#f7f7f5;
  --card:#ffffff;
  --text:#171717;
  --muted:#6c6c6c;
  --line:#e5e3df;
  --soft:#efeeea;
  --accent:#1f2937;
  --shadow:0 8px 24px rgba(0,0,0,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
header{padding:8px 2px 18px}
.kicker{
  font-size:12px;color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;font-weight:800
}
h1{font-size:28px;line-height:1.18;margin:7px 0 7px;letter-spacing:-.03em}
.subtitle{font-size:14px;line-height:1.55;color:var(--muted);margin:0}

.category-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:10px;
}
.category-card{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:18px;
  padding:18px 14px;
  min-height:120px;
  text-align:left;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.category-card:active{transform:scale(.99)}
.category-icon{font-size:28px;margin-bottom:16px}
.category-title{font-size:16px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.category-count{font-size:12px;color:var(--muted);margin-top:5px}

.study-top{
  position:sticky;
  top:0;
  z-index:20;
  margin:0 -16px 16px;
  padding:10px 16px 12px;
  background:rgba(247,247,245,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.back-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:9px 11px;
  font-weight:800;
  cursor:pointer;
}
.study-title{
  font-size:17px;
  font-weight:850;
  letter-spacing:-.02em;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.front-option{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
}
.option-label{
  font-size:13px;
  color:var(--muted);
  font-weight:750;
  white-space:nowrap;
}
.segment{
  display:flex;
  background:var(--soft);
  padding:3px;
  border-radius:10px;
  gap:2px;
}
.segment button{
  border:0;
  background:transparent;
  padding:7px 12px;
  border-radius:8px;
  font-size:13px;
  color:var(--muted);
  font-weight:800;
  cursor:pointer;
}
.segment button.active{
  background:var(--card);
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.progress{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin:3px 2px 10px;
}
.flashcard{
  perspective:1200px;
  width:100%;
  min-height:360px;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.card-inner{
  position:relative;
  width:100%;
  min-height:360px;
  transition:transform .42s ease;
  transform-style:preserve-3d;
}
.flashcard.flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:26px 22px 22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.card-back{transform:rotateY(180deg)}
.situation{
  position:absolute;
  top:18px;
  left:20px;
  right:20px;
  font-size:12px;
  color:var(--muted);
  font-weight:800;
}
.main-text{
  font-size:28px;
  line-height:1.42;
  font-weight:850;
  letter-spacing:-.025em;
  max-width:640px;
}
.main-text.english{font-size:26px}
.note{
  margin-top:18px;
  font-size:14px;
  line-height:1.6;
  color:var(--muted);
  max-width:580px;
}
.hint{
  position:absolute;
  bottom:17px;
  font-size:12px;
  color:var(--muted);
}
.speak-btn{
  position:absolute;
  top:16px;
  right:16px;
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--text);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  cursor:pointer;
  z-index:3;
}
.speak-btn:active{transform:scale(.96)}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.nav-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:13px 14px;
  font-weight:800;
  cursor:pointer;
}
.nav-btn:disabled{opacity:.35}
.shuffle-row{
  display:flex;
  justify-content:center;
  margin-top:10px;
}
.shuffle-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:750;
  padding:10px;
  cursor:pointer;
}
.toast{
  position:fixed;
  left:50%;
  bottom:26px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  background:#111;
  color:#fff;
  padding:9px 12px;
  border-radius:999px;
  font-size:12px;
  pointer-events:none;
  transition:.2s ease;
  z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}


.home-actions{
  margin-top:18px;
  display:grid;
  gap:10px;
}
.important-home-btn{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:16px;
  padding:15px 16px;
  font-weight:850;
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:var(--shadow);
}
.important-home-btn .left{
  display:flex;
  align-items:center;
  gap:9px;
}
.important-home-btn .count-badge{
  min-width:26px;
  height:26px;
  padding:0 8px;
  border-radius:999px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:var(--muted);
}
.reset-wrap{
  margin-top:42px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.reset-btn{
  width:100%;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:14px;
  padding:13px 14px;
  font-size:13px;
  font-weight:750;
  cursor:pointer;
}
.important-card-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:850;
  cursor:pointer;
  white-space:nowrap;
}
.important-card-btn.active{
  background:#fff3bf;
  color:#6b4f00;
  border-color:#ead478;
}
.important-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-left:6px;
  padding:3px 7px;
  border-radius:999px;
  background:#fff3bf;
  color:#6b4f00;
  font-size:10px;
  font-weight:850;
  vertical-align:1px;
}
.study-meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:3px 2px 10px;
}
.study-meta-row .progress{
  margin:0;
  flex:1;
}

@media(min-width:620px){
  .category-grid{grid-template-columns:repeat(3,1fr)}
  .flashcard,.card-inner{min-height:410px}
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111;
    --card:#191919;
    --text:#f3f3f3;
    --muted:#a4a4a4;
    --line:#2e2e2e;
    --soft:#242424;
    --accent:#e9e9e9;
    --shadow:none;
  }
  .study-top{background:rgba(17,17,17,.94)}
  .toast{background:#f2f2f2;color:#111}
}
</style>
</head>
<body>
<div class="wrap">

  <section id="homeView">
    <header>
      <div class="kicker">Business Trip English Reminder</div>
      <h1>상황별 영어</h1>
      <p class="subtitle">카테고리를 선택해 플래시카드로 빠르게 복습합니다. · 300 EXPRESSIONS</p>
    </header>
    <div class="category-grid" id="categoryGrid">
    <button class="category-card" data-id="airport">
      <div class="category-icon">✈️</div>
      <div class="category-title">공항·비행기</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="hotel">
      <div class="category-icon">🏨</div>
      <div class="category-title">호텔</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="transport">
      <div class="category-icon">🚕</div>
      <div class="category-title">이동</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="smalltalk">
      <div class="category-icon">👋</div>
      <div class="category-title">첫 인사·스몰토크</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="meeting">
      <div class="category-icon">🗂️</div>
      <div class="category-title">회의 진행</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="opinions">
      <div class="category-icon">💬</div>
      <div class="category-title">의견·질문·반대</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="numbers">
      <div class="category-icon">🔎</div>
      <div class="category-title">숫자·가격·일정 확인</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="dining">
      <div class="category-icon">🍽️</div>
      <div class="category-title">식사·접대</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="problems">
      <div class="category-icon">⚠️</div>
      <div class="category-title">돌발상황</div>
      <div class="category-count">30개 표현</div>
    </button>

    <button class="category-card" data-id="followup">
      <div class="category-icon">✅</div>
      <div class="category-title">작별·후속 연락</div>
      <div class="category-count">30개 표현</div>
    </button>
</div>

    <div class="home-actions">
      <button class="important-home-btn" id="importantHomeBtn" type="button">
        <span class="left"><span>★</span><span>중요체크</span></span>
        <span class="count-badge" id="importantCount">0</span>
      </button>
    </div>

    <div class="reset-wrap">
      <button class="reset-btn" id="resetBtn" type="button">초기화</button>
    </div>
  </section>

  <section id="studyView" class="hidden">
    <div class="study-top">
      <div class="top-row">
        <button class="back-btn" id="backHome">←</button>
        <div class="study-title" id="studyTitle"></div>
      </div>
      <div class="front-option">
        <div class="option-label">앞면 선택 옵션</div>
        <div class="segment">
          <button id="frontKo" class="active" type="button">한국어</button>
          <button id="frontEn" type="button">영어</button>
        </div>
      </div>
    </div>

    <div class="study-meta-row">
      <div class="progress">
        <span id="progressText"></span>
        <span>카드를 눌러 뒤집기</span>
      </div>
      <button class="important-card-btn" id="importantCardBtn" type="button">☆ 중요체크</button>
    </div>

    <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="플래시카드 뒤집기">
      <div class="card-inner">
        <div class="card-face card-front" id="frontFace"></div>
        <div class="card-face card-back" id="backFace"></div>
      </div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn">← 이전</button>
      <button class="nav-btn" id="nextBtn">다음 →</button>
    </div>
    <div class="shuffle-row">
      <button class="shuffle-btn" id="shuffleBtn">순서 섞기</button>
    </div>
  </section>

</div>

<div class="toast" id="toast">음성 재생을 사용할 수 없습니다.</div>

const frontFace = document.getElementById("frontFace");
const backFace = document.getElementById("backFace");

const shuffleBtn = document.getElementById("shuffleBtn");
const toast = document.getElementById("toast");
const importantHomeBtn = document.getElementById("importantHomeBtn");
const importantCount = document.getElementById("importantCount");
const resetBtn = document.getElementById("resetBtn");
const importantCardBtn = document.getElementById("importantCardBtn");

let currentCategory = null;
let currentItems = [];
let currentIndex = 0;
let currentMode = "category";
let frontLanguage = localStorage.getItem("tripEnglishFrontLanguage") || "ko";
let importantKeys = new Set(JSON.parse(localStorage.getItem("tripEnglishImportant") || "[]"));

function esc(s){
  return s.replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function cardKey(english){
  return english;
}

function saveImportant(){
  localStorage.setItem("tripEnglishImportant", JSON.stringify([...importantKeys]));
  updateImportantHome();
}

function updateImportantHome(){
  importantCount.textContent = importantKeys.size;
  importantHomeBtn.disabled = importantKeys.size === 0;
  importantHomeBtn.style.opacity = importantKeys.size === 0 ? ".55" : "1";
}

function updateFrontLanguageButtons(){
  frontKo.classList.toggle("active", frontLanguage === "ko");
  frontEn.classList.toggle("active", frontLanguage === "en");
}

function getImportantItems(){
  const items = [];
  DATA.forEach(cat=>{
    cat.items.forEach(item=>{
      if(importantKeys.has(cardKey(item[1]))){
        items.push([item[0], item[1], item[2], cat.title, cat.icon]);
      }
    });
  });
  return items;
}

function renderCategories(){
  categoryGrid.innerHTML = DATA.map(cat => `
    <button class="category-card" data-id="${cat.id}">
      <div class="category-icon">${cat.icon}</div>
      <div class="category-title">${esc(cat.title)}</div>
      <div class="category-count">${cat.items.length}개 표현</div>
    </button>
  `).join("");

  categoryGrid.querySelectorAll(".category-card").forEach(btn=>{
    btn.addEventListener("click", ()=>openCategory(btn.dataset.id));
  });
}

function openCategory(id){
  currentMode = "category";
  currentCategory = DATA.find(c => c.id === id);
  currentItems = [...currentCategory.items];
  currentIndex = 0;
  flashcard.classList.remove("flipped");
  studyTitle.textContent = `${currentCategory.icon} ${currentCategory.title}`;
  homeView.classList.add("hidden");
  studyView.classList.remove("hidden");
  renderCard();
  window.scrollTo(0,0);
}

function openImportant(){
  const items = getImportantItems();
  if(!items.length){
    showToast("중요체크한 카드가 없습니다.");
    return;
  }
  currentMode = "important";
  currentCategory = null;
  currentItems = items;
  currentIndex = 0;
  flashcard.classList.remove("flipped");
  studyTitle.textContent = `★ 중요체크`;
  homeView.classList.add("hidden");
  studyView.classList.remove("hidden");
  renderCard();
  window.scrollTo(0,0);
}

function renderCard(){
  if(!currentItems.length){
    studyView.classList.add("hidden");
    homeView.classList.remove("hidden");
    updateImportantHome();
    return;
  }

  const item = currentItems[currentIndex];
  const situation = item[0];
  const english = item[1];
  const korean = item[2];
  const sourceTitle = item[3] || "";
  const sourceIcon = item[4] || "";
  const key = cardKey(english);
  const isImportant = importantKeys.has(key);

  flashcard.classList.remove("flipped");

  const badge = isImportant ? `<span class="important-badge">★ 중요</span>` : "";
  const source = currentMode === "important" && sourceTitle
    ? `${sourceIcon} ${esc(sourceTitle)} · ${esc(situation)}`
    : esc(situation);

  const koFace = `
    <div class="situation">${source}${badge}</div>
    <div class="main-text">${esc(korean)}</div>
    <div class="hint">탭해서 영어 보기</div>
  `;

  const enFace = `
    <button class="speak-btn" type="button" aria-label="Play English audio" data-speak="${esc(english)}">🔊</button>
    <div class="main-text english">${esc(english)}</div>
  `;

  if(frontLanguage === "ko"){
    frontFace.innerHTML = koFace;
    backFace.innerHTML = enFace;
  }else{
    frontFace.innerHTML = enFace;
    backFace.innerHTML = koFace;
  }

  progressText.textContent = `${currentIndex + 1} / ${currentItems.length}`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === currentItems.length - 1;

  importantCardBtn.textContent = isImportant ? "★ 중요체크" : "☆ 중요체크";
  importantCardBtn.classList.toggle("active", isImportant);
  importantCardBtn.dataset.key = key;

  bindSpeakButtons();
}
function bindSpeakButtons(){
  document.querySelectorAll(".speak-btn").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      speakEnglish(btn.dataset.speak);
    });
  });
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1500);
}

function speakEnglish(text){
  if(!("speechSynthesis" in window)){
    showToast("이 기기에서는 음성 재생을 지원하지 않습니다.");
    return;
  }

  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  u.pitch = 1;

  const voices = window.speechSynthesis.getVoices();
  const preferred =
    voices.find(v => v.lang === "en-US" && /Samantha|Alex|Google US English/i.test(v.name)) ||
    voices.find(v => v.lang === "en-US") ||
    voices.find(v => /^en/i.test(v.lang));

  if(preferred) u.voice = preferred;
  window.speechSynthesis.speak(u);
}

flashcard.addEventListener("click", ()=>{
  flashcard.classList.toggle("flipped");
});

flashcard.addEventListener("keydown", e=>{
  if(e.key === "Enter" || e.key === " "){
    e.preventDefault();
    flashcard.classList.toggle("flipped");
  }
});

frontKo.addEventListener("click", ()=>{
  frontLanguage = "ko";
  localStorage.setItem("tripEnglishFrontLanguage", frontLanguage);
  updateFrontLanguageButtons();
  renderCard();
});

frontEn.addEventListener("click", ()=>{
  frontLanguage = "en";
  localStorage.setItem("tripEnglishFrontLanguage", frontLanguage);
  updateFrontLanguageButtons();
  renderCard();
});

prevBtn.addEventListener("click", ()=>{
  if(currentIndex > 0){
    currentIndex--;
    renderCard();
  }
});

nextBtn.addEventListener("click", ()=>{
  if(currentIndex < currentItems.length - 1){
    currentIndex++;
    renderCard();
  }
});

backHome.addEventListener("click", ()=>{
  window.speechSynthesis?.cancel();
  studyView.classList.add("hidden");
  homeView.classList.remove("hidden");
  window.scrollTo(0,0);
});

shuffleBtn.addEventListener("click", ()=>{
  for(let i=currentItems.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentItems[i], currentItems[j]] = [currentItems[j], currentItems[i]];
  }
  currentIndex = 0;
  renderCard();
});


importantHomeBtn.addEventListener("click", openImportant);

importantCardBtn.addEventListener("click", ()=>{
  const key = importantCardBtn.dataset.key;
  if(!key) return;

  if(importantKeys.has(key)){
    importantKeys.delete(key);

    if(currentMode === "important"){
      currentItems.splice(currentIndex, 1);
      if(currentIndex >= currentItems.length){
        currentIndex = Math.max(0, currentItems.length - 1);
      }
    }
  }else{
    importantKeys.add(key);
  }

  saveImportant();
  renderCard();
});

resetBtn.addEventListener("click", ()=>{
  const ok = confirm("중요체크와 앞면 언어 설정을 모두 초기화할까요?");
  if(!ok) return;

  importantKeys.clear();
  frontLanguage = "ko";
  localStorage.removeItem("tripEnglishImportant");
  localStorage.removeItem("tripEnglishFrontLanguage");
  updateImportantHome();
  updateFrontLanguageButtons();
  showToast("초기화했습니다.");
});

if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
}

updateFrontLanguageButtons();
updateImportantHome();
renderCategories();

</script>
</body>
</html>
