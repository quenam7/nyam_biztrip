<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영단어 카드">
<meta name="theme-color" content="#f5f5f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>영어 단어 플래시카드 + 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f3;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#171717}
.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{border:1px solid #d8d8d2;background:#fff;border-radius:14px;padding:13px;font-weight:800;font-size:16px}
.tab.active{background:#222;color:#fff;border-color:#222}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-size:20px;font-weight:850} .counter{color:#777;font-size:14px}
.bar{height:6px;background:#e2e2dc;border-radius:9px;margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:#222;width:0;transition:.2s}
.card{min-height:360px;background:white;border:1px solid #ddd;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;box-shadow:0 6px 24px #0000000d;cursor:pointer}
.word{font-size:44px;font-weight:850}
.meaning{font-size:30px;font-weight:800;line-height:1.4}
.example{margin-top:24px;padding-top:20px;border-top:1px solid #ecece8;width:100%;font-size:19px;line-height:1.5}
.example .ko{font-size:16px;color:#666;margin-top:7px}
.hint{margin-top:18px;color:#888;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.small{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
button{border:1px solid #ddd;background:#fff;border-radius:14px;padding:14px 8px;font-size:15px;font-weight:750;cursor:pointer}
button:active{transform:translateY(1px)}
.known{background:#f0f7f0} .unknown{background:#fff2ef}
.foot{text-align:center;color:#888;font-size:12px;margin-top:14px}
.hidden{display:none!important}
.quizbox{background:#fff;border:1px solid #ddd;border-radius:22px;padding:24px;box-shadow:0 6px 24px #0000000d}
.qtype{font-size:13px;color:#777;font-weight:700;margin-bottom:10px}
.qtext{font-size:26px;font-weight:850;line-height:1.4;margin:8px 0 22px;word-break:keep-all}
.options{display:grid;gap:10px}
.opt{text-align:left;padding:15px 16px;font-size:17px;background:#fff}
.opt.correct{background:#edf7ed;border-color:#8cbf8c}
.opt.wrong{background:#fff0ed;border-color:#d89488}
.feedback{min-height:26px;margin-top:14px;font-size:15px;font-weight:700}
.quiznav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.quiznav button{flex:1}
.result{text-align:center;padding:28px 10px}
.score{font-size:42px;font-weight:900;margin:8px 0}
.pass{font-size:21px;font-weight:850;margin-bottom:18px}
.note{font-size:14px;color:#666;line-height:1.5}
@media(max-width:500px){
 .card{min-height:330px} .word{font-size:38px} .meaning{font-size:27px}
 .qtext{font-size:23px} .example{font-size:17px}
}

.date-home{max-width:760px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.date-title{font-size:26px;font-weight:900;margin:8px 0 8px}
.date-sub{color:#777;font-size:14px;margin-bottom:22px}
.date-list{display:grid;gap:12px}
.date-card{width:100%;text-align:left;background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;box-shadow:0 6px 24px #0000000d}
.date-card .d1{font-size:22px;font-weight:900}
.date-card .d2{font-size:14px;color:#777;margin-top:6px}
.homebtn{margin-bottom:12px;width:100%;background:#fff}
</style>
</head>
<body>
<section id="dateHome" class="date-home">
  <div class="date-title">영어 단어 학습</div>
  <div class="date-sub">학습할 일자를 선택하세요.</div>
  <div class="date-list">
    <button class="date-card" data-date="2026-08-20">
      <div class="d1">2026.08.20</div>
      <div class="d2">영단어 86개 · 플래시카드 + 퀴즈</div>
    </button>
    <button class="date-card" data-date="2026-08-21">
      <div class="d1">2026.08.21</div>
      <div class="d2">영단어 18개 · 플래시카드 + 퀴즈</div>
    </button>
  </div>
</section>

<div id="appWrap" class="wrap hidden">
  <button id="backHome" class="homebtn">← 일자 선택으로 돌아가기</button>
  <div class="tabs">
    <button class="tab active" id="tabCards">플래시카드</button>
    <button class="tab" id="tabQuiz">퀴즈</button>
  </div>

  <section id="cardsView">
    <div class="top"><div class="title">영어 단어 플래시카드</div><div id="counter" class="counter"></div></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="card" class="card">
      <div id="main" class="word"></div>
      <div id="exampleWrap" class="example hidden">
        <div id="exEn"></div>
        <div id="exKo" class="ko"></div>
        <button id="speakExample" style="margin-top:12px">🔊 예문 듣기</button>
      </div>
      <div id="hint" class="hint">카드를 누르면 뜻과 예문이 나옵니다</div>
    </div>
    <div class="grid"><button id="prev">← 이전</button><button id="speak">🔊 발음</button><button id="next">다음 →</button></div>
    <div class="grid2"><button id="unknown" class="unknown">다시 볼 단어</button><button id="known" class="known">아는 단어</button></div>
    <div class="small"><button id="shuffle">🔀 섞기</button><button id="review">↻ 다시 볼 단어만</button><button id="reset">초기화</button></div>
    <div class="foot">발음은 기기의 영어 TTS를 사용합니다.</div>
  </section>

  <section id="quizView" class="hidden">
    <div class="top"><div class="title">혼합 퀴즈</div><div id="qcounter" class="counter"></div></div>
    <div class="bar"><i id="qbar"></i></div>
    <div id="quizBox" class="quizbox">
      <div id="quizPlay">
        <div id="qtype" class="qtype"></div>
        <div id="qtext" class="qtext"></div>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback"></div>
        <div class="quiznav"><button id="qSpeak">🔊 단어 발음</button><button id="qExample" class="hidden">🔊 전체 예문 듣기</button><button id="qNext" disabled>다음 문제 →</button></div>
      </div>
      <div id="quizResult" class="result hidden">
        <div>최종 점수</div>
        <div id="score" class="score"></div>
        <div id="passText" class="pass"></div>
        <div class="note">90% 이상 정답이면 통과합니다.<br>통과하지 못하면 다시 도전해야 합니다.</div>
        <button id="retry" style="margin-top:20px;width:100%">다시 도전</button>
      </div>
    </div>
  </section>
</div>

<script>
const DATASETS={"2026-08-20":[{"en":"mystery","ko":"미스터리, 수수께끼","ex":"The mystery was hard to solve.","exko":"그 수수께끼는 풀기 어려웠다."},{"en":"detective","ko":"탐정","ex":"The detective found a clue.","exko":"탐정이 단서를 찾았다."},{"en":"clue","ko":"단서","ex":"This clue is important.","exko":"이 단서는 중요하다."},{"en":"solve","ko":"해결하다","ex":"Can you solve this problem?","exko":"이 문제를 해결할 수 있니?"},{"en":"evidence","ko":"증거","ex":"The police found evidence.","exko":"경찰이 증거를 찾았다."},{"en":"suspect","ko":"의심하다, 용의자","ex":"The detective questioned the suspect.","exko":"탐정이 용의자를 심문했다."},{"en":"notice","ko":"알아차리다","ex":"I noticed a strange sound.","exko":"나는 이상한 소리를 알아차렸다."},{"en":"strange","ko":"이상한","ex":"That is a strange picture.","exko":"저것은 이상한 그림이다."},{"en":"carefully","ko":"주의 깊게","ex":"Look at the clue carefully.","exko":"단서를 주의 깊게 봐라."},{"en":"observe","ko":"관찰하다","ex":"We observed the animal.","exko":"우리는 그 동물을 관찰했다."},{"en":"find","ko":"찾다, 발견하다","ex":"I found my phone.","exko":"나는 내 전화기를 찾았다."},{"en":"guess","ko":"추측하다","ex":"Can you guess the answer?","exko":"정답을 추측할 수 있니?"},{"en":"important","ko":"중요한","ex":"This information is important.","exko":"이 정보는 중요하다."},{"en":"different","ko":"다른","ex":"These two pictures are different.","exko":"이 두 그림은 다르다."},{"en":"information","ko":"정보","ex":"We need more information.","exko":"우리는 더 많은 정보가 필요하다."},{"en":"case","ko":"사건","ex":"The detective solved the case.","exko":"탐정이 사건을 해결했다."},{"en":"fact","ko":"사실","ex":"That is a fact.","exko":"그것은 사실이다."},{"en":"detail","ko":"세부 사항","ex":"Check every detail.","exko":"모든 세부 사항을 확인해라."},{"en":"question","ko":"질문, 묻다","ex":"I have a question.","exko":"나는 질문이 있다."},{"en":"answer","ko":"대답, 대답하다","ex":"Please answer the question.","exko":"질문에 대답해 주세요."},{"en":"look","ko":"보다","ex":"Look over there.","exko":"저쪽을 봐."},{"en":"look at","ko":"~을 보다","ex":"Look at the sign.","exko":"표지판을 봐."},{"en":"look for","ko":"~을 찾다","ex":"I'm looking for my phone.","exko":"나는 내 휴대폰을 찾고 있다."},{"en":"follow","ko":"따라가다","ex":"Follow the detective.","exko":"탐정을 따라가라."},{"en":"leave","ko":"떠나다, 남기다","ex":"We leave at noon.","exko":"우리는 정오에 떠난다."},{"en":"bring","ko":"가져오다","ex":"Bring your book.","exko":"책을 가져와."},{"en":"take","ko":"가져가다","ex":"Take this book.","exko":"이 책을 가져가."},{"en":"touch","ko":"만지다","ex":"Do not touch the painting.","exko":"그 그림을 만지지 마라."},{"en":"throw","ko":"던지다","ex":"Do not throw the ball inside.","exko":"안에서 공을 던지지 마라."},{"en":"feed","ko":"먹이를 주다","ex":"Do not feed the animal.","exko":"동물에게 먹이를 주지 마라."},{"en":"inside","ko":"안에","ex":"The visitor is inside.","exko":"방문객이 안에 있다."},{"en":"outside","ko":"밖에","ex":"Wait outside the museum.","exko":"박물관 밖에서 기다려라."},{"en":"visitor","ko":"방문객","ex":"A visitor entered the museum.","exko":"방문객이 박물관에 들어왔다."},{"en":"museum","ko":"박물관","ex":"We visited the museum.","exko":"우리는 박물관을 방문했다."},{"en":"animal","ko":"동물","ex":"The animal is sleeping.","exko":"그 동물은 자고 있다."},{"en":"painting","ko":"그림, 회화","ex":"The painting is famous.","exko":"그 그림은 유명하다."},{"en":"phone","ko":"전화기","ex":"My phone is in the room.","exko":"내 전화기는 방 안에 있다."},{"en":"computer","ko":"컴퓨터","ex":"The computer is on the desk.","exko":"컴퓨터가 책상 위에 있다."},{"en":"sign","ko":"표지판","ex":"Read the sign carefully.","exko":"표지판을 주의 깊게 읽어라."},{"en":"rule","ko":"규칙","ex":"You must follow the rule.","exko":"너는 그 규칙을 따라야 한다."},{"en":"excuse me","ko":"실례합니다","ex":"Excuse me, may I come in?","exko":"실례합니다, 들어가도 될까요?"},{"en":"I see.","ko":"그렇군요.","ex":"I see. Thank you.","exko":"그렇군요. 고마워요."},{"en":"of course","ko":"물론이죠","ex":"Of course, you can come.","exko":"물론이죠, 와도 됩니다."},{"en":"how about ~?","ko":"~은 어때요?","ex":"How about this picture?","exko":"이 그림은 어때요?"},{"en":"why not?","ko":"왜 안 돼요?","ex":"Why not go now?","exko":"지금 가는 건 어때?"},{"en":"thank you","ko":"고마워요","ex":"Thank you for your help.","exko":"도와줘서 고마워요."},{"en":"I'm sorry.","ko":"미안합니다","ex":"I'm sorry. I was late.","exko":"미안합니다. 제가 늦었어요."},{"en":"understand","ko":"이해하다","ex":"I understand the rule.","e ko":"사진, 그림","ex":"Look at this picture.","exko":"이 사진을 봐."},{"en":"photograph","ko":"사진","ex":"The photograph was old.","exko":"그 사진은 오래되었다."},{"en":"camera","ko":"카메라","ex":"The camera is on the table.","exko":"카메라가 탁자 위에 있다."},{"en":"door","ko":"문","ex":"Close the door.","exko":"문을 닫아라."},{"en":"window","ko":"창문","ex":"Open the window.","exko":"창문을 열어라."},{"en":"disappear","ko":"사라지다","ex":"The painting disappeared.","exko":"그 그림이 사라졌다."},{"en":"arrive","ko":"도착하다","ex":"We arrived at the museum.","exko":"우리는 박물관에 도착했다."},{"en":"search","ko":"찾다, 수색하다","ex":"The detective searched the room.","exko":"탐정이 방을 수색했다."},{"en":"You must ~.","ko":"너는 반드시 ~해야 한다","ex":"You must follow the rule.","exko":"너는 반드시 규칙을 따라야 한다."},{"en":"You must not ~.","ko":"~하면 안 된다","ex":"You must not touch it.","exko":"그것을 만지면 안 된다."},{"en":"You don't have to ~.","ko":"~할 필요가 없다","ex":"You don't have to come early.","exko":"일찍 올 필요가 없다."},{"en":"taller than","ko":"~보다 더 키가 큰","ex":"Tom is taller than Jack.","exko":"Tom은 Jack보다 키가 크다."},{"en":"more interesting than","ko":"~보다 더 흥미로운","ex":"This book is more interesting than that one.","exko":"이 책은 저 책보다 더 흥미롭다."},{"en":"must + 동사원형","ko":"반드시 ~해야 한다","ex":"You must listen.","exko":"너는 반드시 들어야 한다."},{"en":"must not + 동사원형","ko":"절대로 ~하면 안 된다","ex":"You must not run.","exko":"너는 절대로 뛰면 안 된다."}],"2026-08-21":[{"en":"thought","ko":"생각; think의 과거·과거분사","ex":"I thought about the question.","exko":"나는 그 질문에 대해 생각했다."},{"en":"into","ko":"~안으로, ~속으로","ex":"She walked into the room.","exko":"그녀는 방 안으로 걸어 들어갔다."},{"en":"around","ko":"주위에, 주변에; 약","ex":"We sat around the table.","exko":"우리는 탁자 주위에 앉았다."},{"en":"fussing","ko":"야단법석을 떨며; 안달하며","ex":"Stop fussing about the little things.","exko":"사소한 일로 야단법석 떨지 마라."},{"en":"cradle","ko":"요람, 아기 침대","ex":"The baby slept in the cradle.","exko":"아기가 요람에서 잤다."},{"en":"said","ko":"말했다; say의 과거·과거분사","ex":"She said hello to me.","exko":"그녀는 나에게 인사했다."},{"en":"whispered","ko":"속삭였다","ex":"He whispered my name.","exko":"그는 내 이름을 속삭였다."},{"en":"saw","ko":"보았다; see의 과거","ex":"I saw a bird in the tree.","exko":"나는 나무에서 새 한 마리를 보았다."},{"en":"shouted","ko":"소리쳤다","ex":"The boy shouted for help.","exko":"그 소년은 도와달라고 소리쳤다."},{"en":"picked","ko":"골랐다; 집어 들었다","ex":"She picked a red flower.","exko":"그녀는 빨간 꽃 한 송이를 골랐다."},{"en":"away","ko":"떨어져, 저쪽으로","ex":"The bird flew away.","exko":"새가 멀리 날아갔다."},{"en":"crocodile","ko":"악어","ex":"We saw a crocodile at the zoo.","exko":"우리는 동물원에서 악어를 보았다."},{"en":"biscuits","ko":"비스킷, 과자","ex":"He ate two biscuits.","exko":"그는 비스킷 두 개를 먹었다."},{"en":"front","ko":"앞, 앞쪽","ex":"She stood in front of the door.","exko":"그녀는 문 앞에 서 있었다."},{"en":"stood","ko":"서 있었다; stand의 과거·과거분사","ex":"He stood beside his mother.","exko":"그는 어머니 옆에 서 있었다."},{"en":"decided","ko":"결정했다","ex":"We decided to go home.","exko":"우리는 집에 가기로 결정했다."},{"en":"things","ko":"것들, 물건들","ex":"Put your things in the bag.","exko":"네 물건들을 가방에 넣어라."},{"en":"arranged","ko":"정리했다; 배열했다; 마련했다","ex":"She arranged the books neatly.","exko":"그녀는 책들을 가지런히 정리했다."}]};
let original=DATASETS['2026-08-20'];
let currentDateKey='2026-08-20';
const PASS_MESSAGES={'2026-08-20':'74513','2026-08-21':'저녁잘먹자'};
let words=[...original], i=0, flip=false;

function safeGet(key, fallback='[]'){
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
  catch(e){ return fallback; }
}
function safeSet(key, value){
  try { localStorage.setItem(key, value); } catch(e) {}
}
let bad=new Set(JSON.parse(safeGet('bad')));
let good=new Set(JSON.parse(safeGet('good')));
const $=x=>document.getElementById(x);

function save(){safeSet('bad',JSON.stringify([...bad]));safeSet('good',JSON.stringify([...good]))}
function render(){
 if(!words.length){$('main').className='meaning';$('main').textContent='표시할 단어가 없습니다';$('exampleWrap').classList.add('hidden');$('hint').textContent='초기화 또는 전체 단어를 다시 시작하세요';$('counter').textContent='0 / 0';$('bar').style.width='0';return}
 const w=words[i];
 $('main').className=flip?'meaning':'word';
 $('main').textContent=flip?w.ko:w.en;
 $('exampleWrap').classList.toggle('hidden',!flip);
 $('exEn').textContent=w.ex;
 $('exKo').textContent=w.exko;
 $('hint').textContent=flip?'카드를 누르면 영어로 돌아갑니다':'카드를 누르면 뜻과 예문이 나옵니다';
 $('counter').textContent=(i+1)+' / '+words.length;
 $('bar').style.width=((i+1)/words.length*100)+'%';
}
function next(){if(!words.length)return;i=(i+1)%words.length;flip=false;render()}
function prev(){if(!words.length)return;i=(i-1+words.length)%words.length;flip=false;render()}
function speakText(text, rate=.82){
  if(!text || !('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate;
  const voices = synth.getVoices ? synth.getVoices() : [];
  const en = voices.find(v => /^en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
  if(en) u.voice = en;
  setTimeout(() => synth.speak(u), 30);
}
function speakWord(text){ speakText(text,.82); }
function speakSentence(text){ speakText(text,.78); }
function mark(add,del){if(!words.length)return;let w=words[i].en;add.add(w);del.delete(w);save();next()}
$('card').onclick=()=>{flip=!flip;render()};
$('next').onclick=next;$('prev').onclick=prev;$('speak').onclick=()=>speakWord(words[i]?.en||'');
$('speakExample').onclick=(e)=>{e.stopPropagation();speakSentence(words[i]?.ex||'')};
$('unknown').onclick=()=>mark(bad,good);$('known').onclick=()=>mark(good,bad);
$('shuffle').onclick=()=>{for(let j=words.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[words[j],words[k]]=[words[k],words[j]]}i=0;flip=false;render()};
$('review').onclick=()=>{words=original.filter(w=>bad.has(w.en));i=0;flip=false;render()};
$('reset').onclick=()=>{words=[...original];i=0;flip=false;bad.clear();good.clear();save();render()};

function switchTab(which){
 const quiz=which==='quiz';
 $('cardsView').classList.toggle('hidden',quiz);
 $('quizView').classList.toggle('hidden',!quiz);
 $('tabCards').classList.toggle('active',!quiz);
 $('tabQuiz').classList.toggle('active',quiz);
 if(quiz && !quizStarted) startQuiz();
}
$('tabCards').onclick=()=>switchTab('cards');
$('tabQuiz').onclick=()=>switchTab('quiz');

/* QUIZ */
const PASS_RATE=.90;
let QUIZ_LEN=20;
let quiz=[], qi=0, correct=0, answered=false, quizStarted=false;

function sample(arr,n){
 const a=[...arr];
 for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}
 return a.slice(0,n);
}
function uniqueChoices(correctValue, key, count=4){
 const pool=original.map(w=>w[key]).filter(v=>v!==correctValue);
 return sample(pool,count-1).concat([correctValue]).sort(()=>Math.random()-.5);
}
function blankSentence(w){
 const escaped=w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('\\b'+escaped+'\\b','i');
 if(re.test(w.ex)) return w.ex.replace(re,'□□□□');
 return w.ex.replace(w.en,'□□□□');
}
function buildQuestion(w,type){
 if(type===0){
   return {type:'영어 → 한글',prompt:w.en,answer:w.ko,options:uniqueChoices(w.ko,'ko'),speak:w.en};
 }
 if(type===1){
   return {type:'한글 → 영어',prompt:w.ko,answer:w.en,options:uniqueChoices(w.en,'en'),speak:w.en};
 }
 return {type:'예문 빈칸',prompt:blankSentence(w),answer:w.en,options:uniqueChoices(w.en,'en'),speak:w.en};
}
function startQuiz(){
 quizStarted=true; qi=0; correct=0; answered=false;
 QUIZ_LEN=Math.min(20, original.length);
 const picked=sample(original,QUIZ_LEN);
 quiz=picked.map((w,idx)=>buildQuestion(w,idx%3));
 // Mix the three question types rather than presenting them in a fixed cycle.
 quiz.sort(()=>Math.random()-.5);
 $('quizResult').classList.add('hidden'); $('quizPlay').classList.remove('hidden');
 renderQuiz();
}
function renderQuiz(){
 const q=quiz[qi]; answered=false;
 $('qcounter').textContent=(qi+1)+' / '+QUIZ_LEN;
 $('qbar').style.width=((qi+1)/QUIZ_LEN*100)+'%';
 $('qtype').textContent=q.type;
 $('qtext').textContent=q.prompt;
 $('feedback').textContent='';
 $('qNext').disabled=true;
 $('qExample').classList.add('hidden');
 $('options').innerHTML='';
 q.options.forEach(opt=>{
   const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
   b.onclick=()=>answerQuiz(b,opt); $('options').appendChild(b);
 });
}
function answerQuiz(btn,opt){
 if(answered)return; answered=true;
 const q=quiz[qi], ok=opt===q.answer;
 if(ok) correct++;
 [...$('options').children].forEach(b=>{
   b.disabled=true;
   if(b.textContent===q.answer)b.classList.add('correct');
 });
 if(!ok)btn.classList.add('wrong');
 $('feedback').textContent=ok?'정답입니다.':'정답: '+q.answer;
 if(q.type==='예문 빈칸') $('qExample').classList.remove('hidden');
 $('qNext').disabled=false;
}
$('qSpeak').onclick=()=>speakWord(quiz[qi]?.speak||'');
$('qExample').onclick=()=>{
  const q=quiz[qi];
  if(!q) return;
  const w=original.find(x=>x.en===q.answer) || original.find(x=>x.ex===q.prompt) || original.find(x=>q.prompt.includes('□□□□') && x.en===q.answer);
  if(w) speakSentence(w.ex);
};
$('qNext').onclick=()=>{
 if(qi<QUIZ_LEN-1){qi++;renderQuiz()}else finishQuiz();
};
function finishQuiz(){
 $('quizPlay').classList.add('hidden'); $('quizResult').classList.remove('hidden');
 const pct=Math.round(correct/QUIZ_LEN*100);
 $('score').textContent=correct+' / '+QUIZ_LEN+' ('+pct+'%)';
 const passed=correct/QUIZ_LEN>=PASS_RATE;
 $('passText').textContent=passed?'통과했습니다.':'90% 미만입니다. 다시 도전하세요.';
 $('retry').textContent=passed?'새 퀴즈 풀기':'다시 도전';
 if(passed) setTimeout(()=>alert(PASS_MESSAGES[currentDateKey] || '통과'),150);
}
$('retry').onclick=startQuiz;


function openStudy(dateKey){
  currentDateKey = dateKey;
  original = DATASETS[dateKey] || DATASETS['2026-08-20'];
  words = [...original];
  i=0; flip=false; quizStarted=false;
  $('dateHome').classList.add('hidden');
  $('appWrap').classList.remove('hidden');
  switchTab('cards');
  render();
  window.scrollTo(0,0);
}
function goHome(){
  $('appWrap').classList.add('hidden');
  $('dateHome').classList.remove('hidden');
  window.scrollTo(0,0);
}
document.querySelectorAll('.date-card').forEach(btn=>btn.addEventListener('click', ()=>openStudy(btn.dataset.date)));
$('backHome').onclick=goHome;

render();

  if (location.protocol === 'file:') {
    const f = document.querySelector('.foot');
    if (f) f.innerHTML = '이 파일은 iPhone용 단일 HTML입니다. <b>단, iOS Safari는 로컬 file:// HTML 실행을 제한할 수 있습니다.</b> 가장 안정적인 사용은 HTTPS에 올려 Safari에서 여는 방식입니다.';
  }
});




window.addEventListener('load', async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      for (const key of keys) await caches.delete(key);
    }
  } catch(e) {}
});
